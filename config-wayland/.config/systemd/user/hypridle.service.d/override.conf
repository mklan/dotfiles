# hypridle: survive startup races and user-dbus restarts.
# The stock unit rate-limits after 6 fast failures (start-limit-hit) and then
# stays dead for the rest of the session — exactly what happened when hypridle
# raced the wayland socket/env at Hyprland startup. Disable the rate limit and
# back off between retries instead, so it self-heals.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
