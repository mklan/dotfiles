# hyproled – OLED burn-in shader, per-theme configuration.
# Sourced by ~/.config/hypr/scripts/hyproled.sh (which wraps every hyproled
# call in the hypr scripts) and applied by scripts/switch-theme.sh.
#
# Values: on | off
# The active theme is stored in ~/.cache/theme-mode ("dark" or "light").
HYPROLED_DARK=on
HYPROLED_LIGHT=off
