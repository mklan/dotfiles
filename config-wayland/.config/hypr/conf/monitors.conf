# Laptop

monitor=eDP-1,2880x1800@60,0x0,2


# Monitors
monitor=DP-1,3840x2160@60,auto-left,1.6
monitor=DP-2,3840x2160@60,auto-left,1.6


# HDMI 4k
monitor=HDMI-A-1,3840x2160@60,auto-up,2.5


# unscale XWayland (Steam and other X11 apps render at native 1x instead of being upscaled by the monitor scale)
xwayland {
 force_zero_scaling = true
}

# toolkit-specific scale
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_SCALE_FACTOR,2
#env = XCURSOR_SIZE,32
