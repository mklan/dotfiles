#Autostart

# Setup XDG for screen sharing
exec-once = ~/.config/hypr/scripts/xdg.sh


exec-once = ~/.config/hypr/scripts/battery-monitor.sh

# ----------------------------------------------------- 
# Environment for xdg-desktop-portal-hyprland
# ----------------------------------------------------- 
exec-once=systemctl --user restart dbus
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start xdg-desktop-portal-hyprland


# Start Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1


# for hyprshade
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE

exec-once=dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus

# listener to disable hyproled on fullscreen apps
exec-once=~/.config/hypr/scripts/listener/listen.sh

exec-once=~/dotfiles/scripts/switch-theme.sh dark

exec-once=/usr/lib/at-spi-bus-launcher --exit-with-session
exec-once=hypridle
exec-once=pypr
##exec-once=swww init && swww img ~/wallpaper/ice.jpg
exec-once=nm-applet
#exec-once=blueman-applet

# uncomment for DEBUGGING QUICKSHELL
# exec=killall -q quickshell || env QML_IMPORT_TRACE=1 quickshell -c ~/.config/quickshell & disown
# exec=restart_app waybar
exec=restart_app quickshell -c ~/.config/quickshell
exec-once=redshift-gtk -l 48.20849:16.37208

# fix for wrong keyboard layout in vscode
exec=setxkbmap de

exec=~/.config/hypr/scripts/prevent-oled-burnin.sh
exec-once=~/.config/hypr/scripts/tools/notify-rest/index.ts

exec=[workspace special:assistant silent] ~/.config/hypr/scripts/spawn_assistant.sh

# TODO: fix wifi properly
exec=/usr/bin/nmcli radio wifi on